<h2>Login</h2>
<form id="loginForm">
    <input name="username" id="username" placeholder="Usuário" required>
    <input name="password" id="password" type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
</form>
<p id="erro" style="color:red; display:none;"></p>
<p><a href="{{ url_for('register') }}">Criar nova conta</a></p>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const erroElement = document.getElementById('erro');

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = '/sucesso';
        } else {
            erroElement.textContent = data.message || 'Erro ao realizar login';
            erroElement.style.display = 'block';
        }
    } catch (err) {
        erroElement.textContent = 'Erro de conexão com o servidor';
        erroElement.style.display = 'block';
    }
};
</script>
